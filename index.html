<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Results summary component</title>
    <!-- Reset Styles -->
    <link rel="stylesheet" href="css/reset.css" />
    <!-- Styles -->
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div class="wrapper">
      <section class="result-block">
        <div class="result-block__score score-block">
          <h2 class="score-block__pretitle">Your Result</h2>
          <div class="score-block__score user-score">
            <span class="user-score__score">76</span>
            <span class="user-score__max-score">of 100</span>
          </div>
          <h1 class="score-block__result">Great</h1>
          <p class="score-block__text">
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </div>
        <div class="result-block__summary summary">
          <h2 class="summary__title">Summary</h2>
          <ul class="summary__list list-summary">
            <li class="list-summary__item item-summary">
              <div class="item-summary__categories">
                <img
                  src="assets/images/icon-reaction.svg"
                  alt="lightning icon"
                  width="16"
                  height="16"
                />
                <span class="item-summary__name">Reaction</span>
              </div>
              <div class="item-summary__score">
                <span>80 <span>/ 100</span></span>
              </div>
            </li>
            <li class="list-summary__item item-summary">
              <div class="item-summary__categories">
                <img
                  src="assets/images/icon-memory.svg"
                  alt="Brain icon"
                  width="16"
                  height="16"
                />
                <span class="item-summary__name">Memory</span>
              </div>
              <div class="item-summary__score">
                <span>92 <span>/ 100</span></span>
              </div>
            </li>
            <li class="list-summary__item item-summary">
              <div class="item-summary__categories">
                <img
                  src="assets/images/icon-verbal.svg"
                  alt="Message icon"
                  width="16"
                  height="16"
                />
                <span class="item-summary__name">Verbal</span>
              </div>
              <div class="item-summary__score">
                <span>61 <span>/ 100</span></span>
              </div>
            </li>
            <li class="list-summary__item item-summary">
              <div class="item-summary__categories">
                <img
                  src="assets/images/icon-visual.svg"
                  alt="Eye icon"
                  width="16"
                  height="16"
                />
                <span class="item-summary__name">Visual</span>
              </div>
              <div class="item-summary__score">
                <span>73 <span>/ 100</span></span>
              </div>
            </li>
          </ul>
          <button class="summary__btn" type="button">Continue</button>
        </div>
      </section>
    </div>
    <!-- Your Result 76 of 100 Great You scored higher than 65% of the people who
    have taken these tests. Summary Reaction 80 / 100 Memory 92 / 100 Verbal 61
    / 100 Visual 72 / 100 Continue -->
  </body>
</html>
